<!DOCTYPE html>
<html lang='es'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='style.css'>
    <script type="module" src='./src/main.js' defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <title>Videojuego Teresa</title>
</head>

<body>
    <header class="header">
        <h2 class="nombreJuego">AVENTURA EN EL REINO</h2>
    </header>
    <main id="contenedor">
        <div id="escena1">
            <h1 class="titulos">Creación del Jugador</h1>
            <form id="formularioJugador">
                <label>🧝‍♀️Nombre:</label>
                <input type="text" id="nombre" pattern="^[A-Z][A-Za-z ]{0,19}" required title="Tiene que tener entre 1-20 caracteres y solo se permiten mayúsculas, minúsculas y espacios en blanco">
    
                <div id="mensaje"></div>

                <div id="filas-seguidas">
                    <div>
                        <label>⚔️Ataque</label>
                        <input type="number" id="ataque" value="0" min="0" max="10">
                    </div>
    
                    <div>
                        <label>🛡️Defensa</label>
                        <input type="number" id="defensa" value="0" min="0" max="10">
                    </div>
    
                    <div>
                        <label>❤️Vida</label>
                        <input type="number" id="vida" value="100" min="100" max="110">
                    </div>
                </div>
    
                <label id="puntos">⭐Puntos disponibles:
                    <span id="puntosDisponibles">10</span>
                </label>
    
                <div id="mensajeError"></div>
            </form>
    
            <input type="submit" id="crearJugador" value="Crear Jugador"><br>
        </div>

        <div id="escenaEstadoJugador">
            <div class="tarjetaJugador">
                <img src="./img/images/imagenes/imgGuerrera.svg">
                <h3 class="ataqueJugador"></h3>
                <h3 class="defensaJugador"></h3>
                <h3 class="vidaJugador"></h3>
            </div>
            <input type="submit" id="estadoJugadorbtn" value="Continuar"></input>
        </div>

        <div id="escena2">
            <h1 class="titulos">Mercado</h1>
            <div id="tarjeta-Mercado">

            </div><br>
            <input type="button" id="botonMercado" value="Continuar">
        </div>

        <div id="escena3">
            <div class="tarjetaJugador">
                <img src="./img/images/imagenes/imgGuerrera.svg" alt="jugador">
                <h3 class="vidaJugador">❤️Vida:</h3>
                <h3 class="ataqueJugador">⚔️Ataque:</h3>
                <h3 class="defensaJugador">🛡️Defensa:</h3>
            </div>
            <input type="button" id="botonResumen" value="Continuar">
        </div>

        <div id="escena4">
            <h1 class="titulos">Enemigos Disponibles</h1><br>
            <div id="tarjetas">

            </div><br>
            <input type="button" id="botonEnemigos" value="Comenzar Batallas">
        </div>

        <div id="escena5">
            <br>
            <h1 class="titulos">Batallas</h1>
            <div id="batallas">

            </div>
            <input type="button" id="batallasBtn" value="Siguiente Batalla"><br>
        </div>

        <div id="escena6">
            <br>
            <h1 class="titulos">Resultado Final</h1>
            <div id="contenedorResultado">
                <div id="texto">

                </div>

            </div>


            <input type="button" id="resultadoBtn" value="Resumen de la Partida">
        </div>

        <div id="escena7">
            <br><br>
            <h1 class="titulos">Resumen de la Partida</h1>
            <div id="tabla">
                <table border="1">
                    <thead>
                        <tr id="tablaTr">
                            <th>Nombre</th>
                            <th>Puntos</th>
                            <th>Monedas</th>
                        </tr>
                    </thead>
                    <tbody>
        
                    </tbody>
                </table>
            </div>
            <input type="button" id="rankingConsola" value="Ver el Ranking en Consola">
        
            <input type="button" id="vistaPrincipal" value="Volver a jugar">
        </div>

    </main>

    <footer>
        <div id="dinero">
            <img src="./img/images/imagenes/monedero.png" alt="dinero">
            <span id="monedas"></span>
        </div>

        <div id="cestaMercado">
            <div id="producto1">

            </div>
            <div id="producto2">

            </div>
            <div id="producto3">

            </div>
            <div id="producto4">

            </div>
            <div id="producto5">

            </div>
            <div id="producto6">

            </div>
        </div>
    </footer>
</body>

</html>
